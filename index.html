<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bandera de México</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Bandera de México</h1>

<div class="bandera">

    <div id="verde" class="color">
        <div class="textoColor">Esperanza</div>
    </div>

    <div class="blanco">
        <div class="textoColor blancoTexto">Unidad</div>
        <img src="escudo.png" alt="Escudo de México">
    </div>

    <div id="rojo" class="color">
        <div class="textoColor">Sangre de nuestros héroes nacionales</div>
    </div>
    

</div>

<div class="controles">

    <div class="controlGrupo">
        <label>Intensidad Verde</label>
        <input type="range" id="verdeRange" min="0" max="255" value="128">
        <p id="verdeHEX">#008000</p>
    </div>

    <div class="controlGrupo">
        <label>Intensidad Rojo</label>
        <input type="range" id="rojoRange" min="0" max="255" value="128">
        <p id="rojoHEX">#800000</p>
    </div>

</div>

<footer>
<p>
Karla Esperanza Sanchez Esqueda — 23200898<br>
Iker Adrik Perez Badillo — 23200876<br>
Nancy Jazareth Lugo Cruz — 23200858
</p>
</footer>

<script src="script.js"></script>

</body>
</html>
